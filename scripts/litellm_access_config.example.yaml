# Example access config for scripts/litellm_access_config.py.
# Validate/preview with:
#   uv run python scripts/litellm_access_config.py scripts/litellm_access_config.example.yaml --dry-run
# Apply against a running proxy:
#   uv run python scripts/litellm_access_config.py scripts/litellm_access_config.example.yaml \
#     --base-url http://localhost:4000 --api-key "$LITELLM_MASTER_KEY"

defaults:
  budget_duration: monthly

providers:
  openai:
    litellm_prefix: "openai/"
  bedrock:
    litellm_prefix: "bedrock/"

projects:
  - id: research
    name: Research
    budget_allocations:
      - provider: openai
        budget_limit_usd: 250
        tpm_limit: 5000
        allowed_models: ["gpt-4o", "gpt-4o-mini"]
      - provider: bedrock
        budget_limit_usd: 100
        budget_duration: weekly
        allowed_models: null   # null means all of this provider's models
    members: ["alice"]

users:
  - id: alice
    email: alice@example.com
    display_name: Alice
    projects: ["research"]
  - id: bob
    email: bob@example.com
    projects: ["research"]
